services:
  mysql:  
    image: mysql 
    container_name: mysql 
    restart: always 
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment: 
      MYSQL_DATABASE: rocketdb
      MYSQL_USER: ilya
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: 
      - "mysql_data:/var/lib/mysql"
    networks:
      - go-network

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - go-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - go-network

  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.0
    volumes:
      - ./docker/grafana.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - go-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}

  nginx:
    depends_on:
      - wordpress
      - grafana
    image: nginx
    container_name: nginx-web
    restart: always 
    ports:
      - "80:80"
      - "443:443"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
       - ./certs:/etc/nginx/certs:ro
    networks:
      - go-network

  wordpress:
    depends_on:
      mysql:
        condition: service_healthy
    image: wordpress
    container_name: wordpress
    restart: always 
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ilya
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: rocketdb
    volumes:
      - "wordpress_data:/var/www/html"
    networks:
      - go-network

volumes: 
  mysql_data:
  wordpress_data: 
  grafana-data:

networks:
  go-network:
    driver: bridge
services:
  mysql:  
    image: mysql 
    container_name: mysql 
    restart: always 
    environment: 
      MYSQL_DATABASE: rocketdb
      MYSQL_USER: ilya
      MYSQL_PASSWORD: superpass
      MYSQL_ROOT_PASSWORD: "1"
    volumes: 
      - "mysql_data:/var/lib/mysql"
    networks:
      - go-network

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - go-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - go-network

  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.0
    volumes:
      - ./docker/grafana.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - go-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Qwerty123

  nginx:
    depends_on:
      - wordpress
    image: nginx
    container_name: nginx-web
    restart: always 
    ports:
      - "80:80"
      - "443:443"
    volumes:
       - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
       - ./certs:/etc/nginx/certs:ro
    networks:
      - go-network

  wordpress:
    depends_on:
      - mysql
    image: wordpress 
    container_name: wordpress
    restart: always 
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ilya
      WORDPRESS_DB_PASSWORD: superpass
      WORDPRESS_DB_NAME: rocketdb
    volumes:
      - "wordpress_data:/var/www/html"
    networks:
      - go-network

volumes: 
  mysql_data:
  wordpress_data: 
  grafana-data:

networks:
  go-network:
    driver: bridge
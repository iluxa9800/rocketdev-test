name: Проверка Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Проверить файлы и Bash-скрипты
        run: |
          test -f docker/prometheus.yml
          test -f docker/grafana.yml
          test -f nginx/nginx.conf || { echo "Ошибка: Файл nginx/nginx.conf не найден"; exit 1; }
          bash -n fail2ban/install.sh
          bash -n scripts/check.sh

      - name: Проверить Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Создать тестовый сертификат
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/site.local.key \
            -out certs/site.local.crt \
            -subj "/CN=site.local" \
            -addext "subjectAltName=DNS:site.local"

      - name: Проверить конфигурацию Nginx
        run: |
          docker run --rm \
            --add-host wordpress:127.0.0.1 \
            --add-host grafana:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" \
            nginx nginx -t

      - name: Запустить MySQL и дождаться готовности
        run: |
          docker compose --env-file .env.example up -d --wait --wait-timeout 180 mysql

      - name: Запустить WordPress
        run: |
          docker compose --env-file .env.example up -d wordpress

      - name: Проверить подключение WordPress к MySQL
        run: |
          docker compose --env-file .env.example exec -T wordpress php -r '
            mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
            $db = new mysqli(
              getenv("WORDPRESS_DB_HOST"),
              getenv("WORDPRESS_DB_USER"),
              getenv("WORDPRESS_DB_PASSWORD"),
              getenv("WORDPRESS_DB_NAME")
            );
            $result = $db->query("SELECT 1");
            $row = $result->fetch_row();
            if ($row[0] !== "1") {
              fwrite(STDERR, "Неожиданный результат SELECT 1\n");
              exit(1);
            }
            echo "Подключение из WordPress к MySQL: OK\n";
          '
      - name: Запустить Grafana и Nginx
        run: |
          docker compose --env-file .env.example up -d grafana nginx

      - name: Проверить HTTP-ответ WordPress через Nginx
        run: |
          response=$(curl --insecure --silent --show-error \
            --connect-timeout 3 --max-time 10 \
            --retry 15 --retry-delay 2 --retry-connrefused \
            --resolve site.local:443:127.0.0.1 \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            https://site.local/)

          read -r http_code redirect_url <<< "$response"

          echo "HTTP-код: $http_code"
          echo "Адрес перенаправления: $redirect_url"

          if [ "$http_code" = "200" ] && [ "$redirect_url" = "https://site.local/wp-admin/install.php" ]; then
            echo "Проверка пройдена"
            exit 0
          else
            echo "Ошибка: ожидали HTTP 302 и перенаправление на установку WordPress"
            exit 1
          fi

      - name: Показать диагностику  при ошибке
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --tail=100 mysql wordpress grafana nginx

      - name: Удалить тестовое окружение
        if: always()
        run: |
          docker compose --env-file .env.example down --volumes --remove-orphans
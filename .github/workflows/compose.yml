name: Проверка Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Проверить файлы и Bash-скрипты
        run: |
          test -f docker/prometheus.yml
          test -f docker/grafana.yml
          test -f nginx/nginx.conf || { echo "Ошибка: Файл nginx/nginx.conf не найден"; exit 1; }
          bash -n fail2ban/install.sh
          bash -n scripts/check.sh

      - name: Проверить Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Создать тестовый сертификат
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/site.local.key \
            -out certs/site.local.crt \
            -subj "/CN=site.local" \
            -addext "subjectAltName=DNS:site.local"

      - name: Проверить конфигурацию Nginx
        run: |
          docker run --rm \
            --add-host wordpress:127.0.0.1 \
            --add-host grafana:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" \
            nginx nginx -t